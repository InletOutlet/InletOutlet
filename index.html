        .activity-name { font-size: 13px; color: #666; margin-bottom: 8px; line-height: 1.3; }
        .meta { font-size: 12px; color: #999; margin-bottom: 6px; }
        .date-info { font-size: 11px; padding: 6px; background: #f0f0f0; border-radius: 3px; margin: 8px 0; }
        .status-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin: 12px 0; }
        .status-btn { padding: 6px; font-size: 11px; border-radius: 4px; border: 1px solid #ddd; background: white; cursor: pointer; }

es": ""}, "B3170": {"id": "B3170", "name": "Form Slab @ Inlet Boat Ramp", "phase": "Inlet Piping", "duration": "?", "start": "2027-07-07", "finish": "2027-07-22", "type": "Activity", "total_mh": 561, "progress": 0, "status": "PEND", "notes": ""}, "B3180": {"id": "B3180", "name": "Pour Slab @ Inlet Boat Ramp", "phase": "Inlet Piping", "duration": "?", "start": "2027-07-22", "finish": "2027-07-28", "type": "Activity", "total_mh": 225, "progress": 0, "status": "PEND", "notes": ""}, "B3190": {"id": "B3190", "name": "Wreck Slab @ Inlet Boat Ramp", "phase": "Outlet Tower", "duration": "?", "start": "2027-08-02", "finish": "2027-08-05", "type": "Activity", "total_mh": 140, "progress": 0, "status": "PEND", "notes": ""}, "B3200": {"id": "B3200", "name": "Form Slab @ Inlet Boat Ramp Gate", "phase": "Outlet Tower", "duration": "?", "start": "2027-08-05", "finish": "2027-08-06", "type": "Activity", "total_mh": 64, "progress": 0, "status": "PEND", "notes": ""}, "B3210": {"id": "B3210", "name": "Pour Slab @ Inlet Boat Ramp Gate", "phase": "Outlet Tower", "duration": "?", "start": "2027-08-06", "finish": "2027-08-10", "type": "Activity", "total_mh": 29, "progress": 0, "status": "PEND", "notes": ""}, "B3220": {"id": "B3220", "name": "Wreck Slab @ Inlet Boat Ramp Gate", "phase": "Outlet Tower", "duration": "?", "start": "2027-08-13", "finish": "2027-08-16", "type": "Activity", "total_mh": 16, "progress": 0, "status": "PEND", "notes": ""}, "B3230": {"id": "B3230", "name": "Install Access Ramp Gates @ Inlet Area", "phase": "Outlet Tower", "duration": "?", "start": "2027-08-16", "finish": "2027-08-23", "type": "Activity", "total_mh": 105, "progress": 0, "status": "PEND", "notes": ""}};
let phases = new Set();
        let selectedDateFilter = null;

        window.init = async () => {
            try {
                // Extract phases from local data
                Object.values(activities).forEach(a => {
                    if (a.phase) phases.add(a.phase);
                });

                // Render UI with local data immediately
                window.populatePhaseFilter();
                window.renderAll();
                window.updateStats();
                console.log('✅ Loaded with embedded dates (308 activities)');

                // Try to sync with Firebase in background (don't block if it fails)
                if (typeof firebase !== 'undefined' && db && storage) {
                    console.log('📡 Attempting Firebase sync...');
                    window.syncWithFirebase();
                } else {
                    console.warn('⚠️ Firebase not available - using local data only');
                    document.getElementById('syncStatus').textContent = '⚠️ Local data (Firebase unavailable)';
                }
            } catch (error) {
                console.error('Init error:', error);
            }
        };

        window.syncWithFirebase = async () => {
            if (!db || !storage) return;
            
            let synced = 0;
            for (const [id, act] of Object.entries(activities)) {
                try {
                    const doc = await db.collection('activities').doc(id).get();
                    if (doc.exists) {
                        const fbData = doc.data();
                        activities[id] = {
                            ...activities[id],
                            status: fbData.status || activities[id].status,
                            progress: fbData.progress || activities[id].progress,
                            notes: fbData.notes || activities[id].notes,
                            attachments: fbData.attachments || []
                        };
                        synced++;
                    } else {
                        await db.collection('activities').doc(id).set(activities[id]);
                        synced++;
                    }
                } catch (e) {
                    console.warn('Sync issue for ' + id + ':', e.message);
                }
            }
            window.renderAll();
            console.log('✅ Synced ' + synced + ' activities from Firebase');
        };

        window.populatePhaseFilter = () => {
            const select = document.getElementById('phaseFilter');
            if (!select) return;
            Array.from(phases).sort().forEach(p => {
                if (select.querySelector('option[value="' + p + '"]')) return;
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                select.appendChild(opt);
            });
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + 'Container').classList.add('active');
        };

        window.getDateRange = (type) => {
            const today = new Date();
            const start = new Date(today);
            const end = new Date(today);
            if (type === 'month') {
                start.setDate(1);
                end.setMonth(end.getMonth() + 1);
                end.setDate(0);
            }
            const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            return { start: fmt(start), end: fmt(end) };
        };

        window.filterByThisMonth = () => {
            selectedDateFilter = window.getDateRange('month');
            window.renderAll();
        };

        window.clearDateFilter = () => {
            selectedDateFilter = null;
            window.renderAll();
        };

        window.matchesDateFilter = (actStart) => {
            if (!selectedDateFilter) return true;
            if (!actStart || actStart === 'TBD') return false;
            return actStart >= selectedDateFilter.start && actStart <= selectedDateFilter.end;
        };

        window.renderAll = () => {
            ['all', 'active', 'completed'].forEach(tab => window.renderTab(tab));
        };

        window.renderTab = (tab) => {
            let list = Object.values(activities);
            const search = document.getElementById('searchBox')?.value.toLowerCase() || '';
            const phase = document.getElementById('phaseFilter')?.value || '';
            const statusVal = document.getElementById('statusFilter')?.value || '';

            list = list.filter(a => {
                if (phase && a.phase !== phase) return false;
                if (statusVal === 'HIDE_COMP' && a.status === 'COMP') return false;
                if (statusVal && statusVal !== 'HIDE_COMP' && a.status !== statusVal) return false;
                if (search && !a.id.toLowerCase().includes(search) && !a.name.toLowerCase().includes(search)) return false;
                if (!window.matchesDateFilter(a.start)) return false;
                if (tab === 'active' && a.status !== 'ACTIVE') return false;
                if (tab === 'completed' && a.status !== 'COMP') return false;
                return true;
            });

            const containerId = {all: 'allContainer', active: 'activeContainer', completed: 'completedContainer'}[tab];
            const container = document.getElementById(containerId);
            if (!container) return;

            if (list.length === 0) {
                container.innerHTML = '<div class="empty">No activities found</div>';
                return;
            }

            container.innerHTML = list.map(a => {
                const attachmentsHtml = (a.attachments || []).map(url => 
                    '<div class="attachment-item">' +
                    '<img src="' + url + '" onclick="window.showModal(\'' + url + '\')">' +
                    '<button class="remove-attachment" onclick="window.removeAttachment(\'' + a.id + '\', \'' + url + '\')">×</button>' +
                    '</div>'
                ).join('');

                return '<div class="activity-card ' + a.status + '">' +
                    '<div class="activity-id">' + a.id + '</div>' +
                    '<div class="activity-name">' + a.name + '</div>' +
                    '<div class="meta">📋 ' + a.phase + ' | 📊 ' + a.total_mh + ' MHs</div>' +
                    '<div class="date-info">📅 ' + a.start + ' → ' + a.finish + '</div>' +
                    '<div style="margin-top: 12px; font-size: 11px; font-weight: 600;">STATUS:</div>' +
                    '<div class="status-buttons">' +
                    '<button class="status-btn ' + (a.status === 'PEND' ? 'active' : '') + '" onclick="window.setStatus(\'' + a.id + '\', \'PEND\')">Pending</button>' +
                    '<button class="status-btn ' + (a.status === 'ACTIVE' ? 'active' : '') + '" onclick="window.setStatus(\'' + a.id + '\', \'ACTIVE\')">Started</button>' +
                    '<button class="status-btn ' + (a.status === 'COMP' ? 'active' : '') + '" onclick="window.setStatus(\'' + a.id + '\', \'COMP\')">Done</button>' +
                    '</div>' +
                    '<div class="progress-section">' +
                    '<div class="progress-label">Progress: ' + a.progress + '%</div>' +
                    '<input type="range" min="0" max="100" value="' + a.progress + '" onchange="window.setProgress(\'' + a.id + '\', this.value)" style="width: 100%;">' +
                    '<div class="progress-bar"><div class="progress-fill" style="width: ' + a.progress + '%;"></div></div>' +
                    '</div>' +
                    '<textarea class="notes" placeholder="Add notes..." onchange="window.setNotes(\'' + a.id + '\', this.value)">' + (a.notes || '') + '</textarea>' +
                    '<div class="attachments-section">' +
                    '<div class="attachments-label">📸 Attachments (' + (a.attachments || []).length + ')</div>' +
                    '<input type="file" accept="image/*" class="attachment-input" onchange="window.addAttachment(\'' + a.id + '\', this)" multiple>' +
                    '<div class="attachment-preview" id="preview_' + a.id + '">' + attachmentsHtml + '</div>' +
                    '</div>' +
                    '</div>';
            }).join('');
        };

        window.setStatus = async (id, status) => {
            activities[id].status = status;
            if (db) {
                try {
                    await db.collection('activities').doc(id).update({ status });
                } catch (e) {
                    console.warn('Could not sync to Firebase:', e.message);
                }
            }
            window.renderAll();
            window.updateStats();
        };

        window.setProgress = async (id, val) => {
            activities[id].progress = parseInt(val);
            if (db) {
                try {
                    await db.collection('activities').doc(id).update({ progress: parseInt(val) });
                } catch (e) {
                    console.warn('Could not sync to Firebase:', e.message);
                }
            }
            window.renderTab('all');
        };

        window.setNotes = async (id, notes) => {
            activities[id].notes = notes;
            if (db) {
                try {
                    await db.collection('activities').doc(id).update({ notes });
                } catch (e) {
                    console.warn('Could not sync to Firebase:', e.message);
                }
            }
        };

        window.addAttachment = async (id, input) => {
            if (!input.files[0]) return;
            if (!storage) {
                alert('File storage not available');
                return;
            }
            const file = input.files[0];
            const path = 'attachments/' + id + '/' + Date.now() + '_' + file.name;
            try {
                const ref = storage.ref(path);
                await ref.put(file);
                const url = await ref.getDownloadURL();
                if (!activities[id].attachments) activities[id].attachments = [];
                activities[id].attachments.push(url);
                if (db) {
                    await db.collection('activities').doc(id).update({ attachments: activities[id].attachments });
                }
                window.renderTab('all');
            } catch (e) {
                console.error('Upload error:', e.message);
                alert('Could not upload file');
            }
        };

        window.removeAttachment = async (id, url) => {
            activities[id].attachments = activities[id].attachments.filter(u => u !== url);
            if (db) {
                try {
                    await db.collection('activities').doc(id).update({ attachments: activities[id].attachments });
                } catch (e) {
                    console.warn('Could not sync to Firebase:', e.message);
                }
            }
            window.renderTab('all');
        };

        window.showModal = (url) => {
            document.getElementById('modalImage').src = url;
            document.getElementById('imageModal').classList.add('show');
        };

        window.closeModal = () => {
            document.getElementById('imageModal').classList.remove('show');
        };

        window.updateStats = () => {
            const pending = Object.values(activities).filter(a => a.status === 'PEND').length;
            const active = Object.values(activities).filter(a => a.status === 'ACTIVE').length;
            const completed = Object.values(activities).filter(a => a.status === 'COMP').length;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('completedCount').textContent = completed;
        };

        window.exportData = () => {
            const json = JSON.stringify(activities, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'harris_tracker_export.json';
            a.click();
        };

        window.resetAllFilters = () => {
            document.getElementById('searchBox').value = '';
            document.getElementById('phaseFilter').value = '';
            document.getElementById('statusFilter').value = '';
            selectedDateFilter = null;
            window.renderAll();
        };

        // Wait for DOM ready, then initialize
        function startApp() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startApp);
                return;
            }
            window.init();
        }
        
        startApp();
    </script>
</body>
